; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
boards_dir = ${PROJECT_DIR}/boards_custom

[env:esp32-s3-audio-board]
; Pinning to 6.6.0 forces Arduino Core 2.0.14, which fixes the IPv6Address error
platform = espressif32 @ 6.6.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
; Memory Configuration for Audio Board
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
; board_build.partitions = full_16mb_app.csv
board_build.partitions = default_16MB.csv

build_src_filter = +<*> -<ui/> -<ui_test.cpp>

build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=3
    ; Enable USB Serial
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Use this if the above isn't enough
    -DUSB_CDC_ON_BOOT=1 
    ; LVGL & TFT Flags
    -DLV_CONF_SKIP=1
    -DLV_COLOR_DEPTH=16
    -DLV_TICK_CUSTOM=1
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=9
    -DTFT_SCLK=4
    -DTFT_CS=3
    -DTFT_DC=7
    -DTFT_RST=-1
    -DTFT_BL=5

lib_deps = 
    https://github.com/tzapu/WiFiManager.git
    bblanchon/ArduinoJson@^7.0.4
    links2004/WebSockets@^2.4.1
    adafruit/Adafruit NeoPixel @ ^1.12.0
    adafruit/Adafruit PN532 @ ^1.3.3
    bodmer/TFT_eSPI@^2.5.43
    lvgl/lvgl@8.3.11
    ; Using the standard versions compatible with Core 2.x
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
    esphome/ESP32-audioI2S @ ^2.0.7

[env:MagicBandHub_noScreen]
platform = espressif32@6.7.0
board = waveshare_esp32s3_touch_lcd_128
framework = arduino
board_build.partitions = full_16mb_app.csv
build_src_filter = +<*> -<ui_test.cpp>

; Matches your working old project
monitor_speed = 115200

lib_deps = 
    WiFi@2.0.0
    LittleFS@2.0.0
    https://github.com/me-no-dev/AsyncTCP.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    lvgl@8.3.11
    adafruit/Adafruit PN532 @ ^1.3.3
    adafruit/Adafruit NeoPixel @ ^1.12.0
    adafruit/Adafruit BusIO @ ^1.17.4

build_flags = 
    -DLV_CONF_INCLUDE_SIMPLE
    -I src
    -I src/ui
    -D BOARD_HAS_PSRAM
    -D LV_FONT_MONTSERRAT_24=1
    -D LV_FONT_MONTSERRAT_48=1
    -D SCREEN_ENABLED=0

[env:MagicBandHub_withScreen]
platform = espressif32@6.7.0
board = waveshare_esp32s3_touch_lcd_128
framework = arduino
board_build.partitions = full_16mb_app.csv
build_src_filter = +<*> -<ui_test.cpp>

; Matches your working old project
monitor_speed = 115200

lib_deps = 
    WiFi@2.0.0
    LittleFS@2.0.0
    https://github.com/me-no-dev/AsyncTCP.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    lvgl@8.3.11
    adafruit/Adafruit PN532 @ ^1.3.3
    adafruit/Adafruit NeoPixel @ ^1.12.0
    adafruit/Adafruit BusIO @ ^1.17.4

build_flags = 
    -DLV_CONF_INCLUDE_SIMPLE
    -I src
    -I src/ui
    -D BOARD_HAS_PSRAM
    -D LV_FONT_MONTSERRAT_24=1
    -D LV_FONT_MONTSERRAT_48=1
    -D SCREEN_ENABLED=1

[env:UI_Test]
platform = espressif32@6.7.0
board = waveshare_esp32s3_touch_lcd_128
framework = arduino
build_src_filter = +<ui_test.cpp> +<ui/ui_events*> +<ui/ui_helpers*> +<ui/ui_img*> +<ui/ui_Scanner*> +<ui/ui.c> +<ui/ui.h> -<ui_main.cpp> -<ui/ui_ManageBands*> -<ui/ui_RecordScreen*> -<ui/ui_Hotspot*>
monitor_speed = 115200
build_flags = 
    -D LV_CONF_INCLUDE_SIMPLE
    -I src/ui
	-I lib/TFT_eSPI
lib_extra_dirs = 
	~/Documents/Arduino/libraries
lib_deps = 
    lvgl@8.3.11
	adafruit/Adafruit PN532 @ ^1.3.3
    adafruit/Adafruit NeoPixel @ ^1.12.0
    adafruit/Adafruit BusIO @ ^1.16.1


; ------------------------------
; New hardware target: FREENOVE ESP32-S3 WROOM Lite (N16R8)
; Screenless MagicBandHub build using the recommended pin map:
; NeoPixel: GPIO21
; PN532 (I2C bus 1): SDA=8 SCL=9 IRQ=10 RST=11
; MAX98357A (I2S): DIN=16 BCLK=17 LRC=18 (SD/EN tied to 3V3)
; microSD (SPI): CS=12 SCK=13 MOSI=14 MISO=15
; ------------------------------

[env:MagicBandHub_Freenove]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<ui_test.cpp> -<ui/*>

; 16MB flash + OPI PSRAM (typical for N16R8 variants)
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = full_16mb_app.csv

lib_deps = 
    WiFi@2.0.0
    LittleFS@2.0.0
    https://github.com/me-no-dev/AsyncTCP.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    adafruit/Adafruit PN532 @ ^1.3.3
    adafruit/Adafruit NeoPixel @ ^1.12.0
    adafruit/Adafruit BusIO @ ^1.17.4

build_flags = 
    -I src
    -I src/ui
    -D BOARD_HAS_PSRAM
    -D SCREEN_ENABLED=0

    ; Recommended pins (override in one place)
    -D LED_PIN=4
    -D LED_COUNT=12

    -D NFC_SDA=1
    -D NFC_SCL=2
    -D NFC_IRQ=10
    -D NFC_RST=11

    -D I2S_DIN=16
    -D I2S_BCLK=17
    -D I2S_LRC=18

    -D SD_CS=12
    -D SD_SCK=13
    -D SD_MOSI=14
    -D SD_MISO=15