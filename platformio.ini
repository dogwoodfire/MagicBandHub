; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
boards_dir = ${PROJECT_DIR}/boards_custom

[env:MagicBandHub_noScreen]
platform = espressif32@6.7.0
board = waveshare_esp32s3_touch_lcd_128
framework = arduino
board_build.partitions = full_16mb_app.csv
build_src_filter = +<*> -<ui_test.cpp>

; Matches your working old project
monitor_speed = 115200

lib_deps = 
    WiFi@2.0.0
    LittleFS@2.0.0
    https://github.com/me-no-dev/AsyncTCP.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    lvgl@8.3.11
    adafruit/Adafruit PN532 @ ^1.3.3
    adafruit/Adafruit NeoPixel @ ^1.12.0
    adafruit/Adafruit BusIO @ ^1.17.4

build_flags = 
    -DLV_CONF_INCLUDE_SIMPLE
    -I src
    -I src/ui
    -D BOARD_HAS_PSRAM
    -D LV_FONT_MONTSERRAT_24=1
    -D LV_FONT_MONTSERRAT_48=1
    -D SCREEN_ENABLED=0

[env:MagicBandHub_withScreen]
platform = espressif32@6.7.0
board = waveshare_esp32s3_touch_lcd_128
framework = arduino
board_build.partitions = full_16mb_app.csv
build_src_filter = +<*> -<ui_test.cpp>

; Matches your working old project
monitor_speed = 115200

lib_deps = 
    WiFi@2.0.0
    LittleFS@2.0.0
    https://github.com/me-no-dev/AsyncTCP.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    lvgl@8.3.11
    adafruit/Adafruit PN532 @ ^1.3.3
    adafruit/Adafruit NeoPixel @ ^1.12.0
    adafruit/Adafruit BusIO @ ^1.17.4

build_flags = 
    -DLV_CONF_INCLUDE_SIMPLE
    -I src
    -I src/ui
    -D BOARD_HAS_PSRAM
    -D LV_FONT_MONTSERRAT_24=1
    -D LV_FONT_MONTSERRAT_48=1
    -D SCREEN_ENABLED=1

[env:UI_Test]
platform = espressif32@6.7.0
board = waveshare_esp32s3_touch_lcd_128
framework = arduino
build_src_filter = +<ui_test.cpp> +<ui/ui_events*> +<ui/ui_helpers*> +<ui/ui_img*> +<ui/ui_Scanner*> +<ui/ui.c> +<ui/ui.h> -<ui_main.cpp> -<ui/ui_ManageBands*> -<ui/ui_RecordScreen*> -<ui/ui_Hotspot*>
monitor_speed = 115200
build_flags = 
    -D LV_CONF_INCLUDE_SIMPLE
    -I src/ui
	-I lib/TFT_eSPI
lib_extra_dirs = 
	~/Documents/Arduino/libraries
lib_deps = 
    lvgl@8.3.11
	adafruit/Adafruit PN532 @ ^1.3.3
    adafruit/Adafruit NeoPixel @ ^1.12.0
    adafruit/Adafruit BusIO @ ^1.16.1